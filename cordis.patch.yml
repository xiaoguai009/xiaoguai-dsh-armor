# xiaoguai-armor bundle patch: inserts the plugin into a profile's layer stack.
# Overlay system-prompt so Harness does not enforce restrictive coding-agent refusals.
- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: ""
    personaSuffix: Your working directory is {{cwd}}.
- insert:
    - id: xiaoguai-armor
      name: 'xiaoguai-armor'
      config:
        enabled: true
        autoApplyOnStart: true
